# ConsultantPulse CRM: one command with Docker Desktop:  docker compose up
services:
  mongo:
    image: mongo:7
    volumes:
      - mongo-data:/data/db
    restart: unless-stopped

  backend:
    build: ./backend
    environment:
      MONGO_URL: mongodb://mongo:27017
    depends_on:
      - mongo
    restart: unless-stopped

  frontend:
    build: ./frontend
    environment:
      API_PROXY_TARGET: http://backend:8001
    ports:
      - "3000:3000"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  mongo-data:
